# ── Gradle JVM Settings ─────────────────────────────────────────────────
# زيادة الذاكرة لتجنب: "insufficient memory for the Java Runtime Environment"
org.gradle.jvmargs=-Xmx1024m -Xms256m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8

# ── Daemon — إيقاف لتوفير RAM ───────────────────────────────────────────
# daemon=false يمنع تراكم عمليات Java في الخلفية
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false

# ── AndroidX ────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true

# ── Kotlin ──────────────────────────────────────────────────────────────
kotlin.incremental=false
