# ── Gradle JVM Settings — Balanced Mode ───────────────────────────────
# الجهاز 7GB RAM. بعد إضافة packages كثيرة (shared_preferences/iconly/
# curved_nav...) الـ 1024MB لم يعد كافياً → رفعنا لـ 2048MB.
# لو ظل ينهار: اقفل LDPlayer + Chrome + أي IDE.
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8

# ── Daemon ──────────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=false
# نُلغي caching لتقليل استهلاك الذاكرة (نفقده سرعة لكن نكسب استقرار)
org.gradle.caching=false
org.gradle.configureondemand=true

# ── AndroidX ────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true

# ── Kotlin Performance ──────────────────────────────────────────────────
kotlin.incremental=true
