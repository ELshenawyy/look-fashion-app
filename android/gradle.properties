# ⚠️ زِدنا Heap من 1.5GB إلى 4GB لحل خطأ "Exhausted heap space" مع Dart VM
# على Windows + Java 17+ الـ G1GC أفضل من SerialGC، و parallel=true يسرّع البناء
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.enableJetifier=true
