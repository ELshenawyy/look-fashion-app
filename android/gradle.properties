# ── Gradle JVM Settings — Low-RAM Mode ─────────────────────────────────
# الجهاز 7GB RAM + LDPlayer/Chrome يستهلكون معظمها → فقط ~1GB متاحة.
# Xmx=1G + SerialGC (أقل overhead من G1GC) + Metaspace صغير = الحد الأدنى
# الذي يبني مشروع بحجم Tala. لو فشل، اقفل LDPlayer وأعد المحاولة.
org.gradle.jvmargs=-Xmx1024m -Xms256m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8

# ── Daemon ──────────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=false
# نُلغي caching لتقليل استهلاك الذاكرة (نفقده سرعة لكن نكسب استقرار)
org.gradle.caching=false
org.gradle.configureondemand=true

# ── AndroidX ────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true

# ── Kotlin Performance ──────────────────────────────────────────────────
kotlin.incremental=true
