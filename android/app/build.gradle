plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin must be applied after Android and Kotlin
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase
    id "com.google.gms.google-services"
}

// ── Release signing — قراءة آمنة من android/key.properties ─────────────
// الملف غير موجود في git (محجوب في .gitignore).
// لو غير موجود → release build يستخدم debug signing تلقائياً (fallback آمن)
// عشان flutter build apk --release يظل يعمل في بيئة بدون keystore.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    // تأكد من أن ملف الـ .jks الفعلي موجود (key.properties قد يشير لمسار خاطئ)
    def storeFilePath = keystoreProperties['storeFile']
    if (storeFilePath != null && file(storeFilePath).exists()) {
        hasReleaseKeystore = true
    }
}

android {
    namespace = "com.example.my_fashion_app"
    compileSdk = 35
    // NDK 27 = أول نسخة تبني مكتبات native متحاذية لصفحات 16KB (متطلب Google Play)
    // وهو أيضاً النسخة التي تطلبها إضافات Firebase. NDK 26 لا يدعم 16KB.
    ndkVersion = "27.0.12077973"

    compileOptions {
        // مطلوب لـ flutter_local_notifications (ودعم Java 8 APIs على minSdk 23)
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "com.tala.orders"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // ── Signing configs ────────────────────────────────────────────────
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // يضمّن رموز التصحيح للكود الأصلي (.so) داخل الـ AAB → يزيل تحذير
            // Play Console "App Bundle يحتوي على رموز برمجية أصلية" ويسهّل
            // تحليل أعطال ANR/Crash.
            ndk {
                debugSymbolLevel 'FULL'
            }
            // لو الـ release keystore موجود → استخدمه (للـ Play Store).
            // لو لا → fallback لـ debug signing (للتجارب المحلية فقط).
            signingConfig hasReleaseKeystore
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

// ── إزالة SafetyNet المهجور ────────────────────────────────────────────
// SafetyNet API توقّف (deprecated) واستُبدل بـ Play Integrity، والتطبيق
// يستخدم AndroidProvider.playIntegrity فقط. نستثني play-services-safetynet
// من كل المصادر العابرة (firebase-appcheck-safetynet, firebase-auth…) لإزالة
// تحذير Play Console. مسار كود SafetyNet لا يُستدعى إطلاقاً → آمن وقت التشغيل،
// وتحذيرات R8 عن الكلاسات المفقودة مُغطّاة بـ -dontwarn في proguard-rules.pro.
configurations.all {
    exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
